name: Review App Deploy

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened]

jobs:
  label:
    name: Select review label
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      name: ${{ steps.select.outputs.name }}
    steps:
      - name: Select review label
        id: select
        env:
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          selected=""
          while IFS= read -r pr_label; do
            name="${pr_label#review:}"
            if [ "$name" != "$pr_label" ] && grep -Eqx '[a-z0-9]([a-z0-9-]{0,28}[a-z0-9])?' <<<"$name"; then
              selected="$name"
              break
            fi
          done < <(jq -r '.[]' <<<"$PR_LABELS_JSON")
          echo "Selected review suffix: ${selected:-none}"
          echo "name=$selected" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy review app
    needs: label
    if: needs.label.outputs.name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: review-app-${{ needs.label.outputs.name }}
    env:
      REVIEW_DOMAIN: review.hubee.data.gouv.fr
      REVIEW_SUFFIX: ${{ needs.label.outputs.name }}
      SSH_DOKKU: "ssh -p 50022 dokku@${{ secrets.DOKKU_HOST }}"
      DOKKU_APP: ${{ needs.label.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Deploy hubee portail on dokku
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 50022 -H ${{ secrets.DOKKU_HOST }} >> ~/.ssh/known_hosts
          git config --global --add safe.directory "$PWD"
          echo "=== Setting config ==="
          $SSH_DOKKU -- apps:exists "$DOKKU_APP" 2>/dev/null || $SSH_DOKKU -- apps:create "$DOKKU_APP"
          $SSH_DOKKU -- postgres:exists "$DOKKU_APP" 2>/dev/null || $SSH_DOKKU -- postgres:create "$DOKKU_APP"
          $SSH_DOKKU -- postgres:linked "$DOKKU_APP" "$DOKKU_APP" 2>/dev/null || $SSH_DOKKU -- postgres:link "$DOKKU_APP" "$DOKKU_APP"
          $SSH_DOKKU -- docker-options:add "$DOKKU_APP" build \
            '--build-arg BUNDLE_GITLAB__HUBEE__NUMERIQUE__GOUV__FR=oauth2:${{ secrets.DOKKU_GITLAB_TOKEN }}'
          dsn=$($SSH_DOKKU -- postgres:info "$DOKKU_APP" --dsn)
          userpass=${dsn#*://}; userpass=${userpass%%@*}
          hostport=${dsn#*@};   hostport=${hostport%%/*}
          $SSH_DOKKU -- config:set --no-restart "$DOKKU_APP" \
            DATABASE_USERNAME="${userpass%%:*}" \
            DATABASE_PASSWORD="${userpass#*:}" \
            DATABASE_HOST="${hostport%%:*}" \
            DATABASE_PORT="${hostport#*:}" \
            DATABASE_NAME="${dsn##*/}" \
            RAILS_MAX_THREADS="2" \
            solid_queue_in_puma="5" \
            SECRET_KEY_BASE="${{ secrets.DOKKU_SECRET_KEY_BASE }}" \
            PROCONNECT_DOMAIN="${{ secrets.DOKKU_PROCONNECT_DOMAIN }}" \
            PROCONNECT_CLIENT_ID="${{ secrets.DOKKU_PROCONNECT_CLIENT_ID }}" \
            PROCONNECT_CLIENT_SECRET="${{ secrets.DOKKU_PROCONNECT_CLIENT_SECRET }}" \
            PROCONNECT_REDIRECT_URI="https://$REVIEW_SUFFIX.${REVIEW_DOMAIN}/connexion/proconnect/retour" \
            PROCONNECT_POST_LOGOUT_REDIRECT_URI="https://$REVIEW_SUFFIX.${REVIEW_DOMAIN}/" \
            SENSITIVE_PROCESS_CODES="SGR,DSG,GRO,SNATED" \
            REVIEW_APP="true" \
            HUB_API_BASE_URL="${{ secrets.DOKKU_HUB_API_BASE_URL }}" \
            KEYCLOAK_BASE_URL="${{ secrets.DOKKU_KEYCLOAK_BASE_URL }}" \
            KEYCLOAK_REALM="${{ secrets.DOKKU_KEYCLOAK_REALM }}" \
            HUB_API_CLIENT_ID="${{ secrets.DOKKU_HUB_API_CLIENT_ID }}" \
            HUB_API_CLIENT_SECRET="${{ secrets.DOKKU_HUB_API_CLIENT_SECRET }}" \
            HUB_API_SCOPE="${{ secrets.DOKKU_HUB_API_SCOPE }}" \
            HUB_API_REFERENTIAL_SCOPE="${{ secrets.DOKKU_HUB_API_REFERENTIAL_SCOPE }}" \
            HUB_API_TELESERVICES_SCOPE="${{ secrets.DOKKU_HUB_API_TELESERVICES_SCOPE }}" \
            ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY="${{ secrets.DOKKU_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}" \
            ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT="${{ secrets.DOKKU_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}"

          echo "=== Push on dokku ==="
          git remote add dokku ssh://dokku@${{ secrets.DOKKU_HOST }}:50022/$DOKKU_APP
          git push dokku HEAD:refs/heads/main --force

          echo "=== Setting domain ==="
          $SSH_DOKKU -- domains:add $DOKKU_APP "$REVIEW_SUFFIX.${REVIEW_DOMAIN}"
          $SSH_DOKKU -- letsencrypt:enable "$DOKKU_APP" --force

          echo "=== Database Seeding ==="
          $SSH_DOKKU -- run $DOKKU_APP /rails/bin/rails db:prepare
          $SSH_DOKKU -- run $DOKKU_APP /rails/bin/rails db:seed
