name: Review App Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    name: Deploy review app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      REVIEW_DOMAIN: review.recette.hubee.data.gouv.fr
      SSH_DOKKU: "ssh -p 50022 dokku@${{ secrets.DOKKU_HOST }}"
      DOKKU_APP: "pr${{ github.event.number }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Deploy hubee portail on dokku
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 50022 -H ${{ secrets.DOKKU_HOST }} >> ~/.ssh/known_hosts
          git config --global --add safe.directory "$PWD"
          echo "=== Setting config ==="
            $SSH_DOKKU -- apps:exists "$DOKKU_APP" 2>/dev/null || $SSH_DOKKU -- apps:create "$DOKKU_APP"
            $SSH_DOKKU -- config:clear "$DOKKU_APP"
            $SSH_DOKKU -- docker-options:clear "$DOKKU_APP"
            $SSH_DOKKU -- docker-options:add "$DOKKU_APP" build \
              '--build-arg BUNDLE_GITLAB__HUBEE__NUMERIQUE__GOUV__FR=oauth2:${{ secrets.DOKKU_GITLAB_TOKEN }}'
            $SSH_DOKKU -- config:set --no-restart "$DOKKU_APP" \
              DATABASE_HOST="${{ secrets.DOKKU_DATABASE_URL }}" \
              DATABASE_PASSWORD="${{ secrets.DOKKU_DATABASE_PASSWORD }}" \
              DATABASE_PORT="${{ secrets.DOKKU_DATABASE_PORT }}" \
              DATABASE_USERNAME="${{ secrets.DOKKU_DATABASE_USERNAME }}" \
              RAILS_MAX_THREADS="2" \
              SECRET_KEY_BASE="${{ secrets.DOKKU_SECRET_KEY_BASE }}" \
              solid_queue_in_puma="5" \
              PROCONNECT_DOMAIN="${{ secrets.DOKKU_PROCONNECT_DOMAIN }}" \
              PROCONNECT_CLIENT_ID="${{ secrets.DOKKU_PROCONNECT_CLIENT_ID }}" \
              PROCONNECT_CLIENT_SECRET="${{ secrets.DOKKU_PROCONNECT_CLIENT_SECRET }}" \
              PROCONNECT_REDIRECT_URI="https://portail.recette.hubee.data.gouv.fr/connexion/proconnect/retour" \
              PROCONNECT_POST_LOGOUT_REDIRECT_URI="https://portail.recette.hubee.data.gouv.fr/" \
              SENSITIVE_PROCESS_CODES="SGR,DSG,GRO,SNATED" \
              ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY="${{ secrets.DOKKU_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}" \
              ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT="${{ secrets.DOKKU_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}"

          echo "=== Push on dokku ==="
          git remote add dokku ssh://dokku@${{ secrets.DOKKU_HOST }}:50022/$DOKKU_APP
          git push dokku HEAD:refs/heads/main --force

          echo "=== Setting domain ==="
          $SSH_DOKKU -- domains:add $DOKKU_APP "$DOKKU_APP.${REVIEW_DOMAIN}"
          $SSH_DOKKU -- letsencrypt:enable "$DOKKU_APP" --force
