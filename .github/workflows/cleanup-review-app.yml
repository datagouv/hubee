name: Review App Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  destroy:
    name: Destroy review app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REVIEW_DOMAIN: review.recette.hubee.data.gouv.fr
      SSH_DOKKU: "ssh -p 50022 dokku@${{ secrets.DOKKU_HOST }}"
      DOKKU_APP: "pr${{ github.event.number }}"
    steps:
      - name: Destroy Dokku app
        run: |
          set -euo pipefail
          set -x
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 50022 -H ${{ secrets.DOKKU_HOST }} >> ~/.ssh/known_hosts

          echo "=== Destroying app $APP ==="
          $SSH_DOKKU -- apps:destroy "$APP" --force
