fr:
  app_name: HubEE
  tagline: Plateforme d'échange sécurisé de fichiers entre administrations

  # Formats de la frise d'historique : le jour de la semaine situe un événement dans une
  # instruction étalée sur plusieurs jours.
  time:
    formats:
      timeline: "%A %d/%m - %H:%M"
      month: "%B %Y"

  activerecord:
    attributes:
      agent:
        civility: Civilité
      # Libellés des valeurs de l'enum : `human_attribute_name("civilities.mr")` résout la
      # clé pointée en `agent/civilities.mr`, d'où la barre oblique.
      agent/civilities:
        mr: M.
        ms: Mme
      membership:
        role: Rôle
        job_title: Fonction
        phone_number: Téléphone
        organization_link: Organisation
      membership/roles:
        member: Agent
        local_administrator: Administrateur local
      data_stream_access:
        data_stream_code: Code du flux
    errors:
      models:
        organization_link:
          attributes:
            siret:
              invalid: doit comporter 14 chiffres
        membership:
          attributes:
            organization_link:
              siret_already_attached: désigne un SIRET auquel l'agent est déjà rattaché

  portail:
    shared:
      skip_links:
        quick_access: Accès rapide
        content: Contenu
        menu: Menu
        footer: Pied de page
      header:
        home_title: Accueil — HubEE
        menu: Menu
        close: Fermer
        nav_label: Menu principal
        home: Accueil
        signed_in_as: "Connecté en tant que %{name} (%{email})"
        sign_out: Se déconnecter
      footer:
        home_title: Retour à l'accueil du site — HubEE — République Française
        description: HubEE — Plateforme d'échange sécurisé de fichiers entre administrations.
        new_window: "%{site} - nouvelle fenêtre"
        accessibility: "Accessibilité : non conforme"
        legal: Mentions légales
        personal_data: Données personnelles
        cookies: Gestion des cookies
        license_link: licence etalab-2.0
        license_link_title: Licence etalab - nouvelle fenêtre
        license_html: Sauf mention explicite de propriété intellectuelle détenue par des tiers, les contenus de ce site sont proposés sous %{link}.
    dashboard:
      index:
        title: Portail HubEE
        heading: Portail HubEE
        lead: Espace de gestion réservé aux administrations.
    deliveries:
      states:
        transmitted: Nouveau
        acknowledged: Reçu
        in_progress: En cours
        awaiting_attachments: En attente de compléments
        done: Traité
        refused: Refusé
        closed: Clos
      state_menu:
        title: Filtrer par état
      attachment_fields:
        filename: Nom du fichier
        kind: Type de pièce
        byte_size: Taille
        download: Téléchargement
      attachments:
        download: Télécharger
        download_named: "Télécharger %{filename}"
      attachment_states:
        pending: En attente
        received: Reçue
        corrupted: Corrompue
        rejected: Rejetée
        deleted: Supprimée
      # Un journal : chaque libellé décrit un fait survenu, pas une action possible.
      events:
        state_changed_html: "%{author} a modifié le statut : %{from} → %{to}"
        attachment_created_html: "%{author} a déposé une pièce"
        downloaded_html: "%{author} a téléchargé une pièce"
        downloaded_all_html: "%{author} a téléchargé toutes les pièces"
        message_sent_html: "%{author} a envoyé un message"
        comment_added_html: "%{author} a ajouté un commentaire interne"
        unknown_html: "%{author} est intervenu sur le télédossier"
        unknown_author: Un auteur inconnu
        # La conséquence et non le mécanisme : ce qui compte est que la personne l'ait reçu.
        broadcast: Information transmise à la personne concernée.
        undated_month: Sans date
      state_form:
        heading: Faire avancer ce télédossier
        label: Nouvel état
        placeholder: Choisir un état
        submit: Enregistrer
        notice: L'émetteur du dossier en sera informé et verra votre nom.
      change_state:
        # Le texte que lit l'émetteur du dossier. Il nomme le statut comme le fait déjà
        # l'historique, pour ne pas dépareiller d'une ligne à l'autre.
        event_messages:
          acknowledged: Changement du statut à SI_RECEIVED
          in_progress: Changement du statut à IN_PROGRESS
          awaiting_attachments: Changement du statut à ADD_AWAITING
          refused: Changement du statut à REFUSED
          done: Changement du statut à DONE
        saved: L'état du télédossier a été modifié.
        errors:
          invalid_request: Ce changement d'état n'est pas possible depuis l'état actuel.
          awaiting_attachments_not_allowed: Ce flux n'autorise pas l'attente de compléments.
          event_limit_reached: Ce télédossier ne peut plus enregistrer d'événement. Passez par le portail actuel.
          unknown_author: "Votre compte ne porte ni prénom ni nom. Contactez le support, l'émetteur du dossier doit pouvoir identifier qui agit."
          rejected: Ce changement n'a pas pu être enregistré. Le support en est informé.
          not_found: Ce télédossier n'est plus accessible.
          unavailable: Le service est momentanément indisponible. Réessayez dans quelques instants.
      errors:
        unavailable: Le service est momentanément indisponible. Réessayez dans quelques instants.
        invalid_request: L'état, le filtre ou la page demandés n'existent pas. Vérifiez l'adresse, ou revenez à l'accueil pour repartir de la liste.
      filters:
        title: Filtrer les résultats
        number: Numéro de télédossier
        number_hint: Complet ou partiel
        period: Période de transmission
        from: À partir du
        to: Jusqu'au
        submit: Filtrer
      # Le rappel des filtres posés, en tags au-dessus des résultats.
      active_filters:
        active: Filtres actifs
        remove: "Retirer le filtre %{filter}"
        number: "Numéro contenant « %{number} »"
        between: "Transmis du %{from} au %{to}"
        from: "Transmis à partir du %{from}"
        to: "Transmis jusqu'au %{to}"
        clear_all: Tout effacer
      # L'infobulle d'un en-tête triable dit ce que le clic fera.
      sort:
        asc: Trier du plus ancien au plus récent
        desc: Trier du plus récent au plus ancien
      pagination:
        label: Pagination des télédossiers
        previous: Page précédente
        next: Page suivante
        page: "Page %{number}"
      # Partagés par la liste et le détail.
      fields:
        number: Numéro
        data_stream: Flux
        state: État
        transmitted_at: Transmis le
        updated_at: Mise à jour le
        applicant: Demandeur
      index:
        title: Mes télédossiers — HubEE
        heading: Les télédossiers de ma structure
        caption: "Télédossiers à l'état « %{state} »"
        total:
          one: 1 télédossier
          other: "%{count} télédossiers"
        empty: Aucun télédossier dans cet état pour votre structure.
        empty_filtered: Aucun télédossier ne correspond à vos critères dans cet état.
        failures:
          no_habilitation: Vous n'êtes habilité sur aucun flux ; aucun télédossier ne peut vous être présenté. Rapprochez-vous de l'administrateur local de votre structure.
          # Le motif est dans le flash : la page ne dit que la conséquence.
          upstream: Les télédossiers de votre structure n'ont pas pu être affichés.
      show:
        title: "Télédossier %{number} — HubEE"
        heading: "Télédossier %{number}"
        back: Retour à la liste
        breadcrumb: Fil d'Ariane
        breadcrumb_open: Voir le fil d'Ariane
        home: Accueil
        summary: Récapitulatif
        deposit_attachments: Pièces du dépôt
        deposit_attachments_empty: Aucune pièce n'accompagnait le dépôt.
        added_attachments: Pièces ajoutées ensuite
        added_attachments_empty: Aucune pièce n'a été ajoutée depuis le dépôt.
        # L'amont ne sert pas les fichiers : le dire évite de chercher un lien qui n'existe pas.
        attachments_notice: Les pièces se consultent depuis votre système d'information. HubEE en présente l'inventaire.
        history: Historique
        history_empty: Aucun événement enregistré pour ce télédossier.
        si_comment: Commentaire à destination des SI
        event_attachments: Pièces apportées
    sessions:
      proconnect_button:
        label: S'identifier avec ProConnect
        info: Qu'est-ce que ProConnect ?
        info_title: Qu'est-ce que ProConnect ? - nouvelle fenêtre
      expired: Votre session a expiré, reconnectez-vous pour continuer.
      second_factor_required: "Vos droits ont changé : votre compte exige désormais une authentification renforcée."
      step_up:
        title: Authentification renforcée — HubEE
        heading: Une authentification renforcée est requise
        body: "Votre compte donne accès à des fonctions sensibles : y entrer demande un second facteur d'authentification, en plus de votre mot de passe."
        what_to_expect: ProConnect va vous redemander votre adresse électronique, puis un code fourni par votre méthode de double authentification — et vous guidera pour en mettre une en place si vous n'en avez pas encore. C'est normal, votre connexion n'a pas échoué.
        call_to_action: Cliquez sur le bouton ci-dessous et suivez les étapes jusqu'au bout. Vous reviendrez ensuite automatiquement sur HubEE.
      create:
        signed_in: Vous êtes connecté.
      destroy:
        provider_unavailable: Vous êtes déconnecté du portail. ProConnect étant momentanément indisponible, votre session ProConnect reste ouverte.
      denied:
        title: Accès refusé — HubEE
        authenticated_with: "Adresse utilisée : %{email}"
        support_html: "Si vous pensez qu'il s'agit d'une erreur ou si vous avez besoin d'aide, écrivez à %{email} en précisant l'heure de votre tentative."
        switch_account_hint: Réessayer avec un autre compte vous déconnectera d'abord de ProConnect.
        switch_account: Essayer avec un autre compte
        unknown_agent:
          heading: Votre compte n'est pas reconnu
          body: Votre identité est vérifiée, mais aucun compte HubEE ne lui correspond. Demandez à votre administration de vous déclarer, puis reconnectez-vous.
        insufficient_authentication_level:
          heading: Votre rattachement n'a pas été vérifié
          body: "L'organisation de votre compte est déclarative : HubEE exige qu'elle soit vérifiée. Reconnectez-vous avec le compte fourni par votre administration."
        unnamed_organization: l'organisation que vous avez choisie
        organization_mismatch:
          heading: Vous n'êtes pas autorisé au titre de cette organisation
          body: "Aucun rattachement ne vous autorise à entrer au titre de %{organization}. Si vous appartenez à plusieurs organisations, réessayez avec une autre ; sinon, contactez votre administration."
        second_factor_required:
          heading: Votre compte exige une authentification à deux facteurs
          body: Votre compte donne accès à des fonctions sensibles et n'a pas pu être protégé par un second facteur. Reconnectez-vous et allez au bout de l'étape proposée par ProConnect, qui prend en charge son installation.
        email_mismatch:
          heading: Votre adresse ne correspond pas à votre compte
          body: "L'adresse de votre compte ProConnect n'est plus celle enregistrée par HubEE. Par précaution, l'accès est suspendu : demandez sa mise à jour à votre administration, puis reconnectez-vous."
      failure:
        title: Échec de la connexion — HubEE
        heading: La connexion a échoué
        body: Une erreur est survenue pendant l'authentification. Aucune session n'a été ouverte. Vous pouvez réessayer.
        support_html: "Si le problème persiste, écrivez à %{email} en précisant l'heure de votre tentative."
    errors:
      back_home: Retour à l'accueil
      stale_page: Cette page n'était plus à jour, elle a été rechargée.
      delivery_history_full:
        title: Pièce non remise — HubEE
        heading: Cette pièce ne peut pas être remise
        lead: "L'historique de ce télédossier a atteint le nombre maximal d'événements : la récupération de la pièce ne peut plus y être inscrite, et le fichier n'est donc pas remis. Réessayer n'y changera rien."
        back_to_delivery: Retour au télédossier
      not_found:
        title: Page introuvable — HubEE
        heading: Page introuvable
        lead: La page que vous cherchez n'existe pas ou a été déplacée.
      unprocessable_entity:
        title: Requête invalide — HubEE
        heading: Requête invalide
        lead: La requête n'a pas pu être traitée.
      internal_server_error:
        title: Erreur serveur — HubEE
        heading: Une erreur est survenue
        lead: Le service rencontre un problème technique. Merci de réessayer ultérieurement.
      service_unavailable:
        title: Service indisponible — HubEE
        heading: Service momentanément indisponible
        lead: Un service dont dépend cette page ne répond pas. Réessayez dans quelques instants.
